# Render blueprint: New → Blueprint → pick this repo. Secret values are entered in the Render dashboard, never committed.
services:
  - type: web
    name: monthledger-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: ohio  # same region as the Neon database (us-east-2), so each query is fast
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://atul-dubey12.github.io
