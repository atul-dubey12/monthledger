spring.application.name=monthledger-api
# 8081 so it can run next to ShiftLedger (8080) during local development.
server.port=8081
# Local dev: H2 file database in Postgres mode, so the same Flyway migrations run here and on Neon.
spring.datasource.url=jdbc:h2:file:./data/monthledger;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.error.include-message=always
# No key locally. In prod, every /api request (except /api/health) must send X-Api-Key.
app.api-key=
app.allowed-origins=http://localhost:4201
